[project]
name = "horusops"
version = "1.0.0"
description = "Autonomous Self-Healing DevOps Platform, Git Auto-Sync & AI Server Orchestrator via Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Al-Shaikh", email = "muhammad.al-shaikh@outlook.com" }]
keywords = ["devops", "self-healing", "git", "automation", "telegram-bot", "ci-cd", "server-manager", "infrastructure"]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/ElShaikh1945/HorusOps"
Repository = "https://github.com/ElShaikh1945/HorusOps"
Issues = "https://github.com/ElShaikh1945/HorusOps/issues"
"Telegram Support" = "https://t.me/HorusOps_chat"
"Telegram News" = "https://t.me/HorusOps"

[project.scripts]
horusops = "git_auto_sync.cli:main"
git-auto-sync = "git_auto_sync.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["git_auto_sync*"]

[tool.setuptools.package-data]
git_auto_sync = ["prompts/*.md"]

[dependency-groups]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
