name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Python Syntax & Compilation Check
      run: |
        python -m py_compile setup_wizard.py telegram_bot_daemon.py server_manager.py ci_cd_engine.py sync_engine.py run_auto_sync.py env_loader.py

    - name: Validate JSON configurations
      run: |
        python -c "import json; json.load(open('servers.example.json')); json.load(open('targets.example.json'))"
